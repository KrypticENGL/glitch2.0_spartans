# SURAKSHA backend: PostGIS + Express API + internal Python routing engine.
#   cp .env.example .env   # then set JWT_SECRET and passwords
#   docker compose up --build
#   docker compose run --rm api npm run db:setup     # migrations + OSM network + demo scenario + demo users
name: suraksha

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suraksha}
      POSTGRES_USER: ${POSTGRES_USER:-suraksha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"   # host access for local tools only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  routing-engine:
    build: ./routing-engine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-suraksha}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-suraksha}
      SNAP_MAX_METERS: ${SNAP_MAX_METERS:-400}
      UNKNOWN_ROAD_POLICY: ${UNKNOWN_ROAD_POLICY:-penalize}
    depends_on:
      db: { condition: service_healthy }
    # No published ports: reachable only from the API over the internal network.
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-suraksha}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-suraksha}
      ROUTING_ENGINE_URL: http://routing-engine:8001
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    depends_on:
      db: { condition: service_healthy }
      routing-engine: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal, public]

volumes:
  pgdata:

networks:
  internal:
  public:
